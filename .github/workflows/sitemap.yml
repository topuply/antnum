name: Generate sitemap
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate sitemap.xml
        uses: guimauvedigital/generate-sitemap@v1
        with:
          base_url: "https://topuply.github.io/antnum" # 無末尾斜線，避免雙斜線URL
          file_extensions: "md,html"
          sitemap_path: "./sitemap.xml"

      # ========== 新增：清理 sitemap ==========
      - name: Clean sitemap content
        run: |
          # 移除lastmod中T之後的時間時區
          sed -i 's/T.*Z//g' sitemap.xml
          # 刪除 changefreq 整行
          sed -i '/<changefreq>.*<\/changefreq>/d' sitemap.xml
          # 刪除 priority 整行
          sed -i '/<priority>.*<\/priority>/d' sitemap.xml

      - name: Commit & Push sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto update sitemap.xml" || echo "No changes to sitemap"
          git push
