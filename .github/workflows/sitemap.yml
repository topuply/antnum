name: Generate sitemap
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate sitemap.xml
        uses: guimauvedigital/generate-sitemap@v1
        with:
          base_url: "https://topuply.github.io/antnum" # ✅ 移除末尾斜線，避免雙斜線URL
          file_extensions: "md,html"
          sitemap_path: "./sitemap.xml"
          # 新增參數：只輸出日期，捨棄時間，解決lastmod格式問題
          lastmod_date_only: true
      - name: Commit & Push sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto update sitemap.xml" || echo "No changes to sitemap"
          git push
